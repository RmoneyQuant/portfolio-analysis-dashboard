[project]
name = "dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "fpdf2>=2.8.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
dashboard = "dashboard:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
